run:
  pipeline: updation
  reason: "test run 5"
  cores: 12
  log_dir: "/home/anirudh/asgard_pipeline/logs/pipeline_logs"
  id: asgard_collation_v5
  env_dir: "/home/anirudh/asgard_pipeline/bin/envs"
  base_dir: "/home/anirudh/asgard_pipeline"
  output_dir: "/home/anirudh/asgard_pipeline/database/raw_genomes"
  # true accumulates prior STORE_DIR genomes; false creates an isolated fresh set.
  update: false


inputs:
  out_fasta: "/home/anirudh/asgard_pipeline/database/collated/version2/filtered/85comp10con/fasta/v2_cp85_con10"
  out_genome_csv_unfiltered: "/home/anirudh/asgard_pipeline/database/collated/version2/genome_file/v2_unfitered"
  out_genome_csv: "/home/anirudh/asgard_pipeline/database/collated/version2/filtered/85comp10con/genome_file/v2_cp85_con10_gf"
  out_protein_csv: "/home/anirudh/asgard_pipeline/database/collated/version2/filtered/85comp10con/protein_file/v2_cp85_con10_pf"
  out_ips_parquet: "/home/anirudh/asgard_pipeline/database/collated/version2/filtered/85comp10con/ips/v2_cp85_con10_ips"
  manual_genomes:
    hc1:
      - accession: GCA_055385335.1
    sc1:
      - accession: GCA_055394625.1

cds:
  bakta_db: "/home/anirudh/asgard_pipeline/database/software_dbs/bakta/db"
  existing: "/home/anirudh/asgard_pipeline/database/cds_genomes"
organisms:
  - name: "Asgardarchaeota"
    assembly_level: 
    refseq_only: false
deduplication:
  # false keeps every CheckM2-passing genome and does not invoke skder.
  enabled: false
  ani: 99.0
  min_af: 0.3
checkm2:
  db_path: /home/anirudh/asgard_pipeline/database/software_dbs/checkm2/CheckM2_database/uniref100.KO.1.dmnd
  Contamination: 15
  Completeness: 85
pipeline_stages:
  - raw
  - filtered
  - derep
gtdb:
  # false downloads verified GTDB taxonomy to metadata_file rather than running GTDB-Tk.
  run_gtdbtk: false
  metadata_file: /home/anirudh/asgard_pipeline/database/raw_genomes/store/metadata/gtdb_ar53_metadata.tsv
  metadata_url: https://data.gtdb.ecogenomic.org/releases/release232/232.0/ar53_metadata_r232.tsv.gz
  db_path:      /home/anirudh/asgard_pipeline/database/software_dbs/release232
  mash_db:      /path/to/gtdbtk_db/mash/gtdb.msh   # reused across runs
  extension:    fna
  prefix:       gtdbtk
  min_perc_aa:  10
  min_af:       0.65
  threads:      16
  pplacer_cpus: 2
  scratch_dir:  /tmp
  extra_args:   ""
download:
  # Choose `gtotree` for GToTree GTDB metadata/accessions, or `ncbi` for NCBI taxon search.
  source: gtotree
  gtotree_command: gtt-get-accessions-from-GTDB
  gtt_taxon: Asgardarchaeota
interproscan:
  phylum_filter: Asgardarchaeota
  ips_path: /home/anirudh/interproscan/
