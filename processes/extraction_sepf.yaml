run:
  id: sepf_v3_rum1
  protein_name: SepF
  pipeline: extraction_pipeline
  base_dir: "/home/anirudh/asgard_pipeline"
  env_dir: "/home/anirudh/asgard_pipeline/bin/envs"
  log_dir: "/home/anirudh/asgard_pipeline/logs/pipeline_logs/"
  reason: To find sepf proteins in asgard
  cores: 24
  taxon_level: phylum
  taxon_filter: Asgardarchaeota
  LOCUS_TAG: locus_tag
SSN:
  RUN_SSN: True
  copy_to_windows: True
  windows_path: "/mnt/e/ssn_outputs"
  SSN_BITSCORES:
  - 50
  - 80
  - 100
  - 120
  - 150
  - 170
  - 200
  identity: 0.95
  ssn_cores: 16
  mem_mb: 16000
  runtime_min: 120
  evlaue: 1e-5
  coverage: 0.6

inputs:
  database: "/home/anirudh/asgard_pipeline/database/collated/version3/filtered/85comp10con/ips/v3_cp85_con10_ips_asgardarchaeota_summary.parquet"
  raw_database: "/home/anirudh/asgard_pipeline/database/collated/version3/filtered/85comp10con/ips/v3_cp85_con10_ips_asgardarchaeota.parquet"
  genome_file: "/home/anirudh/asgard_pipeline/database/collated/version3/filtered/85comp10con/genome_file/v3_cp85_con10_gf_asgardarchaeota.csv"
  protein_file: "/home/anirudh/asgard_pipeline/database/collated/version3/filtered/85comp10con/protein_file/v3_cp85_con10_pf_asgardarchaeota.csv"
  fasta_file: "/home/anirudh/asgard_pipeline/database/collated/version3/filtered/85comp10con/fasta/v3_cp85_con10_asgardarchaeota.faa"
  arcog:
    def_tab: "/home/anirudh/asgard_pipeline/database/COG/ArCOGs/arCOGdef.tab"
    fasta: "/home/anirudh/asgard_pipeline/database/COG/ArCOGs/ar18.fa"
    csv: "/home/anirudh/asgard_pipeline/database/COG/ArCOGs/ar18.ar14.02.csv"

modes:
  parse_ips:
    enabled: True
    remove_hypotheticals: false
    search:
      search_string: SepF
      rstring: 
  hmmsearch:
    enabled: false
    acc_groups:
    - PF01541
  from_manual:
    enabled: false        
    manual_annotation_filter:
    - SepF
  from_fasta_csv: 
    enabled: false


plot:
  y_column: protein_length
  filter_column: Manual_annotation
  filter_values:
  - SepF
  taxon_levels:
  - phylum
  - class
  - order
  
  proteins_presence:
  - SepF


  ymin: 0
  ymax: 250
phylogeny:
  threads: 12
  run_itol_upload: True
  itol_project: Asgard
  madroot: false
