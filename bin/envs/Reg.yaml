name: Reg
channels:
  - conda-forge
  - bioconda
  - defaults
  - astrobiomike
dependencies:
  - pandas=2.3.3
  - mmseqs2
  - seqkit
  - jupyter
  - notebook
  - hmmer
  - datasets 
  - ncbi-datasets-cli >= 18.22
  # Provides gtt-get-accessions for GTDB-verified accession selection.
  - gtotree
  - curl
  - gzip
  - mamba
  - seaborn
  - yaml
  - reportlab
  - biopython
  - scikit-learn
  - networkx
  - colorcet
  - muscle
prefix: /root/miniconda3/envs/Reg
